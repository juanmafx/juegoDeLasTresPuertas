<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Three doors, one pick, five hosts">
<title>Three doors, one pick, five hosts</title>
<style>
.surface { fill: #fcfcfb; }
.title { fill: #0b0b0b; font: 600 16px sans-serif; }
.subtitle { fill: #52514e; font: 13px sans-serif; }
.label { fill: #52514e; font: 12px sans-serif; }
.value { fill: #0b0b0b; font: 12px sans-serif; }
.tick { fill: #898781; font: 11px sans-serif; }
.grid { stroke: #e1e0d9; stroke-width: 1; }
.axis { stroke: #c3c2b7; stroke-width: 1; }
.ref { stroke: #898781; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.s1 { stroke: #2a78d6; fill: #2a78d6; } .s2 { stroke: #eb6834; fill: #eb6834; }
.s3 { stroke: #1baf7a; fill: #1baf7a; } .s4 { stroke: #6250d6; fill: #6250d6; }
.q1 { stroke: #9ec5f4; fill: #9ec5f4; } .q2 { stroke: #5598e7; fill: #5598e7; }
.q3 { stroke: #256abf; fill: #256abf; } .q4 { stroke: #0d366b; fill: #0d366b; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; }
.dashed { fill: none; stroke-width: 2; stroke-dasharray: 6 4; }
.dot { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; } .title, .value { fill: #f0efec; } .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; } .axis { stroke: #383835; } .dot { stroke: #1a1a19; }
  .s1 { stroke: #3987e5; fill: #3987e5; } .s2 { stroke: #d95926; fill: #d95926; }
  .s3 { stroke: #199e70; fill: #199e70; } .s4 { stroke: #9085e9; fill: #9085e9; }
  .q1 { stroke: #2a4f7d; fill: #2a4f7d; } .q2 { stroke: #256abf; fill: #256abf; }
  .q3 { stroke: #5598e7; fill: #5598e7; } .q4 { stroke: #b7d3f6; fill: #b7d3f6; }
}
</style>
<rect class="surface" width="760" height="440"/>
<text class="title" x="20" y="28">Three doors, one pick, five hosts</text>
<text class="subtitle" x="20" y="48">Biased host weights 1,3,1: when the prize is behind the pick it opens door 1 with p = 3/4</text>
<line class="s1 line" x1="250.0" x2="272.0" y1="90.0" y2="90.0"/>
<text class="label" x="280.0" y="94.0">Stay</text>
<line class="s2 line" x1="250.0" x2="272.0" y1="112.0" y2="112.0"/>
<text class="label" x="280.0" y="116.0">Switch</text>
<line class="grid" x1="250.0" x2="250.0" y1="114" y2="390"/>
<text class="tick" x="250.0" y="408" text-anchor="middle">0</text>
<line class="grid" x1="355.0" x2="355.0" y1="114" y2="390"/>
<text class="tick" x="355.0" y="408" text-anchor="middle">0.25</text>
<line class="grid" x1="460.0" x2="460.0" y1="114" y2="390"/>
<text class="tick" x="460.0" y="408" text-anchor="middle">0.5</text>
<line class="grid" x1="565.0" x2="565.0" y1="114" y2="390"/>
<text class="tick" x="565.0" y="408" text-anchor="middle">0.75</text>
<line class="grid" x1="670.0" x2="670.0" y1="114" y2="390"/>
<text class="tick" x="670.0" y="408" text-anchor="middle">1</text>
<text class="label" x="460.0" y="428" text-anchor="middle">Probability of winning, given the decision is reached</text>
<text class="label" x="238" y="154.6" text-anchor="end">Informed host</text>
<rect class="s1" x="250" y="132.0" width="140.0" height="14" rx="2"><title>Informed host, stay: 1/3</title></rect>
<text class="value" x="396.0" y="143.0">1/3</text>
<rect class="s2" x="250" y="148.0" width="280.0" height="14" rx="2"><title>Informed host, switch: 2/3</title></rect>
<text class="value" x="536.0" y="159.0">2/3</text>
<text class="label" x="238" y="207.8" text-anchor="end">Random host, no prize shown</text>
<rect class="s1" x="250" y="185.2" width="210.0" height="14" rx="2"><title>Random host, no prize shown, stay: 1/2</title></rect>
<text class="value" x="466.0" y="196.2">1/2</text>
<rect class="s2" x="250" y="201.2" width="210.0" height="14" rx="2"><title>Random host, no prize shown, switch: 1/2</title></rect>
<text class="value" x="466.0" y="212.2">1/2</text>
<text class="label" x="238" y="261.0" text-anchor="end">Biased host, door 1 opened</text>
<rect class="s1" x="250" y="238.4" width="180.0" height="14" rx="2"><title>Biased host, door 1 opened, stay: 3/7</title></rect>
<text class="value" x="436.0" y="249.4">3/7</text>
<rect class="s2" x="250" y="254.4" width="240.0" height="14" rx="2"><title>Biased host, door 1 opened, switch: 4/7</title></rect>
<text class="value" x="496.0" y="265.4">4/7</text>
<text class="label" x="238" y="314.2" text-anchor="end">Biased host, door 2 opened</text>
<rect class="s1" x="250" y="291.6" width="84.0" height="14" rx="2"><title>Biased host, door 2 opened, stay: 1/5</title></rect>
<text class="value" x="340.0" y="302.6">1/5</text>
<rect class="s2" x="250" y="307.6" width="336.0" height="14" rx="2"><title>Biased host, door 2 opened, switch: 4/5</title></rect>
<text class="value" x="592.0" y="318.6">4/5</text>
<text class="label" x="238" y="367.4" text-anchor="end">Adversarial host, switch offered</text>
<rect class="s1" x="250" y="344.8" width="420.0" height="14" rx="2"><title>Adversarial host, switch offered, stay: 1/1</title></rect>
<text class="value" x="676.0" y="355.8">1/1</text>
<rect class="s2" x="250" y="360.8" width="1.0" height="14" rx="2"><title>Adversarial host, switch offered, switch: 0/1</title></rect>
<text class="value" x="257.0" y="371.8">0/1</text>
<line class="axis" x1="250" x2="250" y1="114" y2="390"/>
</svg>
