<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-label="Raising the price of a reveal flips the optimum from one corner to the other">
<title>Raising the price of a reveal flips the optimum from one corner to the other</title>
<style>
.surface { fill: #fcfcfb; }
.title { fill: #0b0b0b; font: 600 16px sans-serif; }
.subtitle { fill: #52514e; font: 13px sans-serif; }
.label { fill: #52514e; font: 12px sans-serif; }
.value { fill: #0b0b0b; font: 12px sans-serif; }
.tick { fill: #898781; font: 11px sans-serif; }
.grid { stroke: #e1e0d9; stroke-width: 1; }
.axis { stroke: #c3c2b7; stroke-width: 1; }
.ref { stroke: #898781; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.s1 { stroke: #2a78d6; fill: #2a78d6; } .s2 { stroke: #eb6834; fill: #eb6834; }
.s3 { stroke: #1baf7a; fill: #1baf7a; } .s4 { stroke: #6250d6; fill: #6250d6; }
.q1 { stroke: #9ec5f4; fill: #9ec5f4; } .q2 { stroke: #5598e7; fill: #5598e7; }
.q3 { stroke: #256abf; fill: #256abf; } .q4 { stroke: #0d366b; fill: #0d366b; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; }
.dashed { fill: none; stroke-width: 2; stroke-dasharray: 6 4; }
.dot { stroke: #fcfcfb; stroke-width: 2; }
@media (prefers-color-scheme: dark) {
  .surface { fill: #1a1a19; } .title, .value { fill: #f0efec; } .subtitle, .label { fill: #c3c2b7; }
  .grid { stroke: #2c2c2a; } .axis { stroke: #383835; } .dot { stroke: #1a1a19; }
  .s1 { stroke: #3987e5; fill: #3987e5; } .s2 { stroke: #d95926; fill: #d95926; }
  .s3 { stroke: #199e70; fill: #199e70; } .s4 { stroke: #9085e9; fill: #9085e9; }
  .q1 { stroke: #2a4f7d; fill: #2a4f7d; } .q2 { stroke: #256abf; fill: #256abf; }
  .q3 { stroke: #5598e7; fill: #5598e7; } .q4 { stroke: #b7d3f6; fill: #b7d3f6; }
}
</style>
<rect class="surface" width="760" height="440"/>
<text class="title" x="20" y="28">Raising the price of a reveal flips the optimum from one corner to the other</text>
<text class="subtitle" x="20" y="48">Dots mark the exact optimum; the critical cost here is 1/10, where the tie goes to K = 0</text>
<line class="grid" x1="72.0" x2="564.0" y1="347.1" y2="347.1"/>
<text class="tick" x="64.0" y="351.1" text-anchor="end">-1</text>
<line class="grid" x1="72.0" x2="564.0" y1="281.3" y2="281.3"/>
<text class="tick" x="64.0" y="285.3" text-anchor="end">-0.5</text>
<line class="grid" x1="72.0" x2="564.0" y1="215.6" y2="215.6"/>
<text class="tick" x="64.0" y="219.6" text-anchor="end">0</text>
<line class="grid" x1="72.0" x2="564.0" y1="149.8" y2="149.8"/>
<text class="tick" x="64.0" y="153.8" text-anchor="end">0.5</text>
<line class="grid" x1="72.0" x2="564.0" y1="84.0" y2="84.0"/>
<text class="tick" x="64.0" y="88.0" text-anchor="end">1</text>
<line class="axis" x1="72.0" x2="564.0" y1="380.0" y2="380.0"/>
<text class="tick" x="72.0" y="398.0" text-anchor="middle">0</text>
<text class="tick" x="133.5" y="398.0" text-anchor="middle">1</text>
<text class="tick" x="195.0" y="398.0" text-anchor="middle">2</text>
<text class="tick" x="256.5" y="398.0" text-anchor="middle">3</text>
<text class="tick" x="318.0" y="398.0" text-anchor="middle">4</text>
<text class="tick" x="379.5" y="398.0" text-anchor="middle">5</text>
<text class="tick" x="441.0" y="398.0" text-anchor="middle">6</text>
<text class="tick" x="502.5" y="398.0" text-anchor="middle">7</text>
<text class="tick" x="564.0" y="398.0" text-anchor="middle">8</text>
<text class="label" x="318.0" y="420.0" text-anchor="middle">Doors opened by the host (K), 10 doors, informed host, switch</text>
<text class="label" x="72.0" y="74.0" text-anchor="start">Net value V(K)</text>
<g><title>c = 0/1</title>
<path class="q1 line" d="M72.0,202.4L133.5,200.8L195.0,198.6L256.5,195.8L318.0,191.9L379.5,186.0L441.0,176.1L502.5,156.4L564.0,97.2"/>
</g>
<circle class="q1 dot" cx="564.0" cy="97.2" r="6"><title>c = 0/1: K* = 8, V = 9/10</title></circle>
<g><title>c = 1/20</title>
<path class="q2 line" d="M72.0,202.4L133.5,207.3L195.0,211.8L256.5,215.6L318.0,218.2L379.5,218.8L441.0,215.6L502.5,202.4L564.0,149.8"/>
</g>
<circle class="q2 dot" cx="564.0" cy="149.8" r="6"><title>c = 1/20: K* = 8, V = 1/2</title></circle>
<g><title>c = 1/10</title>
<path class="q3 line" d="M72.0,202.4L133.5,213.9L195.0,225.0L256.5,235.3L318.0,244.5L379.5,251.7L441.0,255.0L502.5,248.4L564.0,202.4"/>
</g>
<circle class="q3 dot" cx="72.0" cy="202.4" r="6"><title>c = 1/10: K* = 0, V = 1/10</title></circle>
<g><title>c = 3/20</title>
<path class="q4 line" d="M72.0,202.4L133.5,220.5L195.0,238.1L256.5,255.0L318.0,270.8L379.5,284.6L441.0,294.5L502.5,294.5L564.0,255.0"/>
</g>
<circle class="q4 dot" cx="72.0" cy="202.4" r="6"><title>c = 3/20: K* = 0, V = 1/10</title></circle>
<text class="value" x="574.0" y="101.2">c = 0/1, K* = 8</text>
<text class="value" x="574.0" y="153.8">c = 1/20, K* = 8</text>
<text class="value" x="574.0" y="206.4">c = 1/10, K* = 0</text>
<text class="value" x="574.0" y="259.0">c = 3/20, K* = 0</text>
