name: CI

on:
  push:
    branches: [master, modernize/2026]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.13.5"
          enable-cache: false
      - run: uv sync --locked --python "${MATRIX_PYTHON}"
        env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
      - run: uv run --locked ruff check . ../tools
      - run: uv run --locked ruff format --check . ../tools
      - run: uv run --locked mypy
      - run: uv run --locked mypy --strict ../tools
      - run: uv run --locked pytest
      - run: uv run --locked python -I ../tools/enumerate.py ../spec/scenarios.json --check
      - run: uv run --locked python tools/write_spec_data.py --check
      - run: uv run --locked python -I ../tools/conformance.py --cli "python -m monty_hall.lab"
      - run: uvx --from pip-audit==2.10.1 pip-audit --strict --disable-pip -r <(uv export --locked --no-emit-project --format requirements-txt)
        shell: bash
